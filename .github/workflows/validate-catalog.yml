name: validate catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install --quiet jsonschema

      - name: Validate catalogue against data/
        run: python3 scripts/validate_catalog.py

      - name: Refuse anything that looks like a credential
        run: python3 scripts/check_no_secrets.py
