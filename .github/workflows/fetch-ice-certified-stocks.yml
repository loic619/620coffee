name: fetch ICE certified stocks

# 620 is an acquisition worker. This is the workload it exists to run: in 619
# the same fetch cost ~1,247 billed minutes a week — 38% of that repo's entire
# Actions bill — because the run is a deliberately rate-limit-paced sweep at
# 4s/request and spends ~42 minutes mostly waiting. Waiting is free here.
#
# It publishes the days it just fetched, and nothing else. History belongs to
# 619; see fetch/PORTING.md and docs/DATA_CONTRACT.md.
#
# No secrets. ICE's reports are public, and the ported orchestrator's Telegram
# helper no-ops when TELEGRAM_BOT_TOKEN is unset — which it always is here.

on:
  schedule:
    # Daily, Tue–Sat 01:05 UTC: by then the prior business day's full report set
    # has been published for hours. Off the :00 mark, which GitHub's scheduler
    # contends hardest for.
    - cron: '5 1 * * 2-6'
    # Weekly catch-up, Sunday: a wider window that self-heals any day the daily
    # run missed. Free, and the merge in 619 is idempotent, so re-delivering
    # days already held costs nothing.
    - cron: '25 2 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: "Business-day window to fetch"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-ice-certified-stocks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Matches 619. A full tier-2 sweep is 1,810 candidates at 4s/req = 121 min,
    # so 150 leaves headroom without letting a wedged run burn three hours.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fetch dependencies
        # Mirrors 619's ICE workflow. xlrd is pinned below 2.0 deliberately:
        # 2.x dropped the legacy .xls BIFF format that ICE's arabica report
        # uses, and an unpinned install silently breaks that parse. pdfplumber
        # is imported lazily inside parse_pdfs.py, so its absence surfaces only
        # when a grading-overview or infested-warrant PDF is actually reached.
        run: pip install --quiet requests 'xlrd<2.0' openpyxl pdfplumber

      # No tier-1 secret, and nothing to materialise. The dated publish-time
      # log is committed at fetch/scraper/sources/ice_certified_stocks/
      # stock_report_hits.json, exactly as in 619, so tier 0 and tier 1 are
      # both live from the moment this job checks out. The commit step at the
      # bottom writes back whatever the run learned.

      - name: Fetch and publish the current window
        run: |
          DAYS="${{ inputs.days || (github.event.schedule == '25 2 * * 0' && '30' || '3') }}"
          echo "window = $DAYS business days"
          python3 fetch/publish_ice.py --days "$DAYS"

      - name: Refresh the catalogue index
        run: python3 scripts/validate_catalog.py --update

      - name: Verify nothing outside the allow-list is about to be published
        run: python3 scripts/check_allowlist.py

      - name: Verify payloads contain only records inside their window
        run: python3 scripts/check_payload_window.py

      - name: Verify no credential-shaped strings
        run: python3 scripts/check_no_secrets.py

      # Run telemetry, for comparing 620's request economics against 619's.
      # An artifact rather than a commit: these are per-run diagnostics with no
      # value to a later run, and committing them would add a churn commit to
      # every fetch. 30 days is long enough to compare against 619.
      - name: Upload run telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ice-run-stats
          path: |
            fetch/scraper/sources/ice_certified_stocks/ice_run_stats.json
            fetch/scraper/sources/ice_certified_stocks/stock_report_cursor.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the payload
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The hits log is added alongside the payload: it is learned state,
          # and a run that captures a new publish second has to write that back
          # or tier 0 is empty for that date on the next run. `git add` on a
          # missing path exits 128 and would kill the step under `bash -e`, so
          # it is added only if the fetcher actually wrote it (619 hit exactly
          # this — run 32955091040 fetched successfully and threw it away).
          git add data/ice catalog.json CATALOG.md
          HITS=fetch/scraper/sources/ice_certified_stocks/stock_report_hits.json
          [ -f "$HITS" ] && git add "$HITS"
          if git diff --cached --quiet; then
            echo "No change in the published window."
            exit 0
          fi
          git commit -m "data: ICE certified stocks window [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          echo "::error::could not push the ICE window"
          exit 1

      # Hand off to 619's consumer. 620 is the sole ICE fetcher from
      # 2026-09-09; 619's own 1.07 is retired to manual rollback, so nothing
      # brings the window home unless this dispatch or 1.27's cron does.
      #
      # Placed after the commit, so a dispatch only ever describes a payload that
      # is already published — 1.27 reads raw.githubusercontent, not this
      # runner's disk.
      #
      # Targets the FILENAME (sync-from-620.yml), which is stable across the
      # renumbering that breaks display titles.
      #
      # NEEDS A CROSS-REPO TOKEN. GITHUB_TOKEN is scoped to this repository and
      # cannot dispatch a workflow in 619, so this reads SYNC_619_TOKEN: a
      # fine-grained PAT with Actions: read and write on loic619/619coffee only.
      # Until that secret exists the step says so and skips — a WARNING, not an
      # error, because "not configured yet" is a known state and 1.27's two daily
      # crons carry the cycle meanwhile. Once configured, a dispatch that fails
      # is an ERROR with the HTTP code and body, because then it is a real break.
      #
      # continue-on-error: the fetch is the production work and it is already
      # pushed. A dead consumer must not lose the day's payload.
      - name: Hand off to 619 (sync-from-620)
        id: handoff
        continue-on-error: true
        env:
          SYNC_619_TOKEN: ${{ secrets.SYNC_619_TOKEN }}
        run: |
          if [ -z "$SYNC_619_TOKEN" ]; then
            echo "::warning::SYNC_619_TOKEN is not set — cannot dispatch 619's 1.27."
            echo "The payload is published; 1.27's 03:40 and 09:40 crons will pick it up."
            echo "To enable the handoff: create a fine-grained PAT with Actions"
            echo "read+write on loic619/619coffee and add it here as SYNC_619_TOKEN."
            exit 0
          fi
          code=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer $SYNC_619_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/loic619/619coffee/actions/workflows/sync-from-620.yml/dispatches" \
            -d '{"ref":"main"}')
          # 204 No Content is the endpoint's only success. 401/403 (token expired
          # or wrong scope), 404 (renamed file, or a token that cannot see the
          # repo) and 422 (bad ref) are all silent no-ops unless asserted.
          if [ "$code" = "204" ]; then
            echo "Dispatched 619 sync-from-620.yml on main."
            exit 0
          fi
          echo "::error::Handoff to 619 failed — HTTP $code: $(cat /tmp/dispatch.out)"
          echo "The payload is published and safe. 1.27's crons remain the fallback."
          exit 1
