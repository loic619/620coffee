name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install --quiet jsonschema pytest requests ruff==0.16.6

      - name: Lint
        run: ruff check .

      - name: Validate catalogue against data/
        run: python3 scripts/validate_catalog.py

      - name: Verify published payloads carry only allow-listed raw fields
        run: python3 scripts/check_allowlist.py

      - name: Verify payloads contain only records inside their window
        run: python3 scripts/check_payload_window.py

      - name: Refuse anything that looks like a credential
        run: python3 scripts/check_no_secrets.py

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Verify the port has not drifted beyond its two documented hunks
        run: |
          # fetch/PORTING.md pins orchestrate.py as the only file differing from
          # 619, in exactly two places. Anything else is drift.
          count=$(grep -cE "PORTED TO 620|PACING EXPERIMENT" fetch/scraper/sources/ice_certified_stocks/orchestrate.py)
          if [ "$count" -ne 3 ]; then
            echo "::error::expected 3 documented divergences from 619 (2 path anchors + the pacing experiment), found $count"
            exit 1
          fi
          echo "port markers intact"
