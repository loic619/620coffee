name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        # The fetch dependencies are needed too: test_pacing_baseline.py imports
        # orchestrate to assert the real constants rather than grepping for them,
        # and orchestrate pulls in the parsers. Same pins as the fetch workflow.
        run: pip install --quiet jsonschema pytest ruff==0.16.6 requests 'xlrd<2.0' openpyxl pdfplumber

      - name: Lint
        run: ruff check .

      - name: Validate catalogue against data/
        run: python3 scripts/validate_catalog.py

      - name: Verify published payloads carry only allow-listed raw fields
        run: python3 scripts/check_allowlist.py

      - name: Verify payloads contain only records inside their window
        run: python3 scripts/check_payload_window.py

      - name: Refuse anything that looks like a credential
        run: python3 scripts/check_no_secrets.py

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Verify the port has not drifted beyond its two documented hunks
        run: |
          # fetch/PORTING.md pins orchestrate.py as the only file differing from
          # 619, in exactly two places. Anything else is drift.
          count=$(grep -c "PORTED TO 620" fetch/scraper/sources/ice_certified_stocks/orchestrate.py)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 PORTED TO 620 markers (the path anchors — pacing is now identical to 619), found $count"
            exit 1
          fi
          echo "port markers intact"
